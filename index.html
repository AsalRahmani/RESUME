<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رزومه عسل رحمانی</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Vazirmatn',sans-serif;background:#0d0b1a;padding:90px 16px 40px;}
  .toolbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:rgba(13,11,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);}
  .toolbar button{font-family:inherit;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;}
  .toolbar button:hover{background:rgba(255,255,255,.16);}
  .toolbar button.active{background:#FF6B4A;border-color:#FF6B4A;}
  
  .page{max-width:980px;margin:0 auto;background:#FFFDF9;border-radius:26px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.45);}
  .hero{padding:38px 40px;background:linear-gradient(120deg,#FF6B4A,#6C3CE9);color:#fff;display:flex;align-items:center;gap:26px;}
  .avatar{width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;}
  .hero-text h1{font-size:30px;font-weight:800;}
  .layout{display:grid;grid-template-columns:1fr 300px;}
  .main-col{padding:32px 36px;}
  .side-col{background:#F4EFFF;padding:32px 26px;border-right:1px solid #E4D9FF;}
  .sec{margin-bottom:30px;}
  .sec-title{font-size:14.5px;font-weight:800;color:#3D1E99;display:flex;align-items:center;gap:8px;}
  .sec-title::before{content:'';width:8px;height:8px;border-radius:2px;background:#FF6B4A;}
  .item{padding-bottom:18px;border-bottom:1px dashed #e6ddff;margin-bottom:16px;}
  
  [contenteditable="true"]{outline:2px dashed transparent;border-radius:6px;padding:2px 4px;}
  .editing [contenteditable="true"]:hover{outline-color:#12B8A6;background:rgba(18,184,166,.06);}
  .del-btn,.add-btn{display:none;}
  .editing .del-btn{display:inline-block;background:#ff3b3b;color:#fff;border:none;padding:2px 8px;border-radius:50%;cursor:pointer;}
  .editing .add-btn{display:block;width:100%;margin-top:12px;padding:10px;border:2px dashed #6C3CE9;background:transparent;color:#3D1E99;font-weight:700;border-radius:10px;cursor:pointer;}
  
  @media print{.toolbar{display:none!important;}}
</style>
</head>
<body>

<div class="toolbar">
  <button id="btnEdit">🔓 ویرایش</button>
  <button id="btnSave">💾 ذخیره</button>
  <button id="btnPrint">🖨️ PDF</button>
</div>

<div class="page" id="resumePage">
  <header class="hero">
    <div class="avatar">ع</div>
    <div class="hero-text">
      <h1 contenteditable="false">عسل رحمانی</h1>
      <div contenteditable="false" style="font-size:15px;color:rgba(255,255,255,.92);">طراح و ادمین وردپرس</div>
    </div>
  </header>
  <div class="layout">
    <main class="main-col">
      <section class="sec">
        <h2 class="sec-title">درباره من</h2>
        <p contenteditable="false">طراح سایت وردپرسی با تجربه در طراحی و پشتیبانی فروشگاه‌های اینترنتی.</p>
      </section>
      <section class="sec">
        <h2 class="sec-title">سوابق شغلی</h2>
        <div id="expList">
          <div class="item">
            <button class="del-btn">✕</button>
            <div><strong contenteditable="false">طراح سایت — شرکت دیجیتال</strong> <span contenteditable="false" style="color:#12B8A6;">۱۴۰۴</span></div>
            <div contenteditable="false" style="color:#544e6b;margin-top:5px;">طراحی و توسعه سایت‌های وردپرسی</div>
          </div>
        </div>
        <button class="add-btn" id="addExp">+ افزودن</button>
      </section>
      <section class="sec">
        <h2 class="sec-title">دوره‌ها</h2>
        <div id="courseList">
          <div class="item">
            <button class="del-btn">✕</button>
            <div><strong contenteditable="false">آموزش سئو</strong></div>
            <div contenteditable="false" style="color:#544e6b;">مکتب خونه - ۲۶ ساعت</div>
          </div>
        </div>
        <button class="add-btn" id="addCourse">+ افزودن</button>
      </section>
    </main>
    <aside class="side-col">
      <section class="sec">
        <h2 class="sec-title">مشخصات</h2>
        <div><span>سن:</span> <span contenteditable="false">۲۱ سال</span></div>
        <div><span>شهر:</span> <span contenteditable="false">مشهد</span></div>
      </section>
    </aside>
  </div>
</div>

<script>
let editing = false;

document.getElementById('btnEdit').onclick = function(){
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.querySelectorAll('[contenteditable]').forEach(el => {
    el.contentEditable = editing;
  });
  this.textContent = editing ? '🔒 پایان' : '🔓 ویرایش';
  this.classList.toggle('active', editing);
};

document.getElementById('btnSave').onclick = function(){
  localStorage.setItem('resume-simple', document.getElementById('resumePage').innerHTML);
  alert('✅ ذخیره شد!');
};

document.getElementById('btnPrint').onclick = function(){
  window.print();
};

// بارگذاری خودکار
const saved = localStorage.getItem('resume-simple');
if(saved) document.getElementById('resumePage').innerHTML = saved;

// حذف
document.addEventListener('click', function(e){
  if(e.target.classList.contains('del-btn')){
    const item = e.target.closest('.item');
    if(item && confirm('حذف شود؟')) item.remove();
  }
});

// افزودن
function addItem(listId, html){
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = html;
  document.getElementById(listId).appendChild(el);
}

document.getElementById('addExp').onclick = function(){
  addItem('expList', `
    <button class="del-btn">✕</button>
    <div><strong contenteditable="true">عنوان شغلی</strong> <span contenteditable="true" style="color:#12B8A6;">تاریخ</span></div>
    <div contenteditable="true" style="color:#544e6b;margin-top:5px;">توضیحات...</div>
  `);
};

document.getElementById('addCourse').onclick = function(){
  addItem('courseList', `
    <button class="del-btn">✕</button>
    <div><strong contenteditable="true">نام دوره</strong></div>
    <div contenteditable="true" style="color:#544e6b;">موسسه - مدت</div>
  `);
};

console.log('✅ رزومه آماده است! روی "ویرایش" کلیک کنید.');
</script>
</body>
</html>
